name: Python baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QUANT_LOAD_DOTENV: "0"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python scripts/check_baseline.py
      - name: Collect all five modules
        run: uv run --locked pytest --collect-only -q
      - name: Run credential-free tests
        run: uv run --locked pytest --junitxml=test-results/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore

  cpp:
    name: C++ extension (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv sync --locked
      - name: Build hft_cpp
        run: |
          uv pip install pybind11 cmake
          PYTHON="$PWD/.venv/bin/python" bash ./hft-engine/cpp/build_cpp.sh
      - name: hft-engine suite (C++ tests must not skip)
        run: uv run --no-sync --locked pytest hft-engine/tests/ -q -rs
