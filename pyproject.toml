# =============================================================================
# IG Market Data Project — Workspace Root Configuration
# =============================================================================
# This file defines the workspace-level tooling and project metadata.
# Each sub-module has its own pyproject.toml for package-specific dependencies.
# =============================================================================

[project]
name = "ig-market-data-project"
version = "0.1.0"
description = "Systematic quant trading platform: IG data ingestion, option pricing, HFT engine, ML signals, and autonomous agents"
authors = [
    { name = "Koate Kpai", email = "koate.kpai@example.com" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "ig-market-data",
    "quant-methods",
    "hft-engine",
    "ml-for-finance",
    "agentic-finance",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-cov>=5", "ruff>=0.5"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["market-data", "quant-methods", "hft-engine", "ml-for-finance", "agentic-finance"]

[tool.uv.sources]
ig-market-data = { workspace = true }
quant-methods = { workspace = true }
hft-engine = { workspace = true }
ml-for-finance = { workspace = true }
agentic-finance = { workspace = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.urls]
Repository = "https://github.com/koatedevopskpai/quant-research-ig"
Documentation = "https://github.com/koatedevopskpai/quant-research-ig/blob/main/README.md"

# =============================================================================
# Linting & Formatting (ruff)
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

# =============================================================================
# Testing (pytest)
# =============================================================================
[tool.pytest.ini_options]
testpaths = [
    "market-data/tests",
    "quant-methods/tests",
    "hft-engine/tests",
    "ml-for-finance/tests",
    "agentic-finance/tests",
]
addopts = "--import-mode=importlib -v --tb=short --strict-markers --basetemp=test-results/tmp"
markers = ["integration: opt-in checks requiring external services"]
